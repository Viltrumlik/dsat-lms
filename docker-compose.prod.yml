# DSAT LMS v2 — Production stack
# Domain: Deploy
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything reads from a single .env beside this file. Nothing here publishes a
# port except Nginx: Postgres and Redis are reachable only on the compose
# network, which is the difference between a database behind a password and a
# database on the internet.

# Every container writes to the json-file driver, and its default is no limit at
# all: logs grow until the disk is full, which takes the database down with them
# and is the most ordinary way a small server dies. 10MB x 5 caps each container
# at 50MB and keeps a few days of history at this traffic.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsat_db}
      POSTGRES_USER: ${POSTGRES_USER:-dsat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # Cache AND broker. `appendonly` keeps queued tasks across a restart;
    # maxmemory-policy protects the broker from being evicted by cache churn —
    # noeviction means a full Redis refuses writes instead of silently dropping
    # a queued email.
    command: >
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - media_data:/app/media

  # Migrations run ONCE, as their own unit — not in the web container's command.
  # Two web replicas both running `migrate` on boot is a race, and a migration
  # failure should stop the deploy rather than crash-loop a serving container.
  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: python manage.py migrate --noinput
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # Everything EXCEPT email. settings.base routes tasks to four queues, and one
    # worker draining all four made that routing decorative: a nightly rollup or
    # a support sweep occupies the pool for minutes, and a verification code
    # queued behind it is a student staring at a form that will not let them in.
    # Slow work and work someone is waiting for do not belong in one pool.
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=200
      -Q celery,analytics,notifications
    # The same media volume as `web`, and not for symmetry: apps.files.tasks
    # .purge_soft_deleted_attachments runs HERE (it is unrouted, so it lands on
    # the default queue) and deletes blobs off disk. Without the mount under
    # STORAGE_BACKEND=local it deletes the row, fails to find the file, and
    # FileSystemStorage swallows the error — the database forgets an attachment
    # the disk keeps forever. A leak that only shows up as a full disk.
    volumes:
      - media_data:/app/media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker-email:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # Email only. Each task is one SMTP round trip, so the useful setting is
    # concurrency, not CPU — and it must never queue behind analytics. The
    # mailer's own quotas (apps/mailer/quota.py) are what bound the volume; this
    # only bounds the wait.
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=${CELERY_EMAIL_CONCURRENCY:-2}
      --max-tasks-per-child=500
      -Q email
      -n email@%h
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d email@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # Exactly one beat, ever. Two schedulers means every periodic task fires
    # twice — two sweeps, two reminder emails, two rollups.
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # The image's HEALTHCHECK curls :8000/healthz, which is right for `web` and
    # meaningless here — beat runs no web server, so it inherited a probe that
    # can never pass and reported unhealthy forever while firing its schedule
    # perfectly. A check that is always red is worse than none: it is the one
    # that teaches everyone to ignore the health column.
    #
    # Disabled rather than replaced because beat exposes nothing cheap and
    # honest to ask. It answers no port, and `celery inspect ping` only reaches
    # workers. A crashed beat exits, and `restart: unless-stopped` handles that;
    # what a probe would add is detecting a beat that is up but no longer
    # scheduling, and there is no signal for that short of watching whether
    # tasks arrive — which belongs in monitoring, not a container probe.
    healthcheck:
      disable: true
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DESMOS_API_KEY: ${NEXT_PUBLIC_DESMOS_API_KEY:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deploy/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      # A STABLE path for the logs, because fail2ban has to watch them from the
      # host. Docker's own log file lives under the container id, so it moves
      # every time nginx is recreated — and a jail pointed at the old path does
      # not fail, it just silently stops banning anyone. Rotation for these is
      # installed by deploy/harden.sh; nginx also still writes to stdout, so
      # `docker compose logs nginx` is unchanged.
      - ./logs/nginx:/var/log/nginx
    # Reload every 6h so a renewed certificate is actually served. Nginx reads
    # the certificate once, at start: renewal writes a new file and the running
    # process keeps presenting the old one until told otherwise — so the site
    # expires on schedule while a perfectly good certificate sits on disk.
    command: >
      sh -c 'while :; do sleep 6h; nginx -s reload; done &
             nginx -g "daemon off;"'
    depends_on:
      - web
      - frontend

  # Renewal on a loop, for the same reason the backup runs on one: a certificate
  # renewed by a command in a runbook is a certificate that expires. These last
  # 90 days, so the failure arrives one quarter after the deploy, long after
  # anyone is watching — and it takes the whole site down at once, because a
  # browser will not proceed past an expired certificate.
  #
  # Twice a day: certbot only acts inside the last 30 days, so every other run
  # is a no-op, and checking often means a transient failure has 60 more chances
  # before anything is at risk. Nginx picks the new file up on its own reload
  # loop above — certbot cannot signal a process in another container.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    logging: *logging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         certbot renew --webroot -w /var/www/certbot --quiet || echo "[certbot] renew failed" >&2;
         sleep 12h;
       done'

  # A backup that only exists as a command in a runbook is a backup nobody has
  # taken. Same Postgres image so the client version always matches the server's
  # — a pg_dump older than the cluster refuses outright, which is a thing to
  # discover now rather than after an upgrade.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-dsat}
      POSTGRES_DB: ${POSTGRES_DB:-dsat_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    # A sleep loop rather than cron: the image has no cron, and a loop's failures
    # land in `docker compose logs backup` instead of a crontab's silence. It
    # backs up first and sleeps after, so a restart is never a skipped day.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         /usr/local/bin/backup.sh || echo "[backup] run failed" >&2;
         sleep "$$BACKUP_INTERVAL_SECONDS";
       done'
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  media_data:
  backups:
  certbot_conf:
  certbot_www:
