# DSAT LMS v2 — Production stack
# Domain: Deploy
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything reads from a single .env beside this file. Nothing here publishes a
# port except Nginx: Postgres and Redis are reachable only on the compose
# network, which is the difference between a database behind a password and a
# database on the internet.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsat_db}
      POSTGRES_USER: ${POSTGRES_USER:-dsat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache AND broker. `appendonly` keeps queued tasks across a restart;
    # maxmemory-policy protects the broker from being evicted by cache churn —
    # noeviction means a full Redis refuses writes instead of silently dropping
    # a queued email.
    command: >
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - media_data:/app/media

  # Migrations run ONCE, as their own unit — not in the web container's command.
  # Two web replicas both running `migrate` on boot is a race, and a migration
  # failure should stop the deploy rather than crash-loop a serving container.
  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: python manage.py migrate --noinput
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # Everything EXCEPT email. settings.base routes tasks to four queues, and one
    # worker draining all four made that routing decorative: a nightly rollup or
    # a support sweep occupies the pool for minutes, and a verification code
    # queued behind it is a student staring at a form that will not let them in.
    # Slow work and work someone is waiting for do not belong in one pool.
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=200
      -Q celery,analytics,notifications
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker-email:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # Email only. Each task is one SMTP round trip, so the useful setting is
    # concurrency, not CPU — and it must never queue behind analytics. The
    # mailer's own quotas (apps/mailer/quota.py) are what bound the volume; this
    # only bounds the wait.
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=${CELERY_EMAIL_CONCURRENCY:-2}
      --max-tasks-per-child=500
      -Q email
      -n email@%h
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d email@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # Exactly one beat, ever. Two schedulers means every periodic task fires
    # twice — two sweeps, two reminder emails, two rollups.
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DESMOS_API_KEY: ${NEXT_PUBLIC_DESMOS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deploy/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - frontend

  # A backup that only exists as a command in a runbook is a backup nobody has
  # taken. Same Postgres image so the client version always matches the server's
  # — a pg_dump older than the cluster refuses outright, which is a thing to
  # discover now rather than after an upgrade.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-dsat}
      POSTGRES_DB: ${POSTGRES_DB:-dsat_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    # A sleep loop rather than cron: the image has no cron, and a loop's failures
    # land in `docker compose logs backup` instead of a crontab's silence. It
    # backs up first and sleeps after, so a restart is never a skipped day.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         /usr/local/bin/backup.sh || echo "[backup] run failed" >&2;
         sleep "$$BACKUP_INTERVAL_SECONDS";
       done'
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  media_data:
  backups:
  certbot_conf:
  certbot_www:
