# Shared proxy headers.
#
# X-Forwarded-For is APPENDED to, not set: with NUM_PROXIES=1 Django reads the
# last hop, and overwriting the header here would let a client forge the value
# the throttles key on.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";

# Django emits its own HSTS (SECURE_HSTS_SECONDS), and nginx's add_header does
# not replace an upstream header — it appends. Two Strict-Transport-Security
# headers is not dangerous (RFC 6797 says take the first) but it means the
# policy a browser applies depends on which path it happened to load, which is
# not a thing anyone should have to reason about. Drop the upstream copy and let
# the TLS terminator be the single source of it. Django's setting stays as it is
# so `check --deploy` keeps passing on its own terms.
proxy_hide_header Strict-Transport-Security;

# Longer than gunicorn's 30s timeout, so a request that gunicorn kills produces
# gunicorn's error rather than a bare 504 from the proxy.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
