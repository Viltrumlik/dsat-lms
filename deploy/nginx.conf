# DSAT LMS v2 — Nginx (TLS termination + reverse proxy)
# Domain: Deploy
#
# One host, two backends: /api, /django-admin, /static and the probes go to
# Django; everything else is the Next.js app. Compression lives here rather than
# in Django or Next — the proxy is the one place that sees every response, and
# doing it once beats doing it twice.

# Docker's embedded DNS, re-checked every 10s.
#
# There were `upstream` blocks here, with keepalive, and they took the whole API
# down after a routine deploy. An upstream block resolves its server name ONCE,
# at startup, and caches the address for the life of the process. Recreating the
# `web` container gives it a new address, so nginx went on connecting to the old
# one — every /api/, /healthz and /django-admin/ request answered 502 while the
# container behind them was healthy and Docker's DNS was returning the right
# address the whole time. Nothing recovers on its own; it needs a human to
# notice and restart nginx.
#
# Resolving through a VARIABLE (see $backend / $frontend below) is what makes
# nginx look the name up per request instead of once. The cost is upstream
# keepalive, which needs a named upstream to attach to: every proxied request
# now opens a TCP connection to a container on the same host. That is a fraction
# of a millisecond, and it buys a proxy that survives its own backend being
# redeployed — which is not a trade, it is a correction.
resolver 127.0.0.11 valid=10s ipv6=off;

# Slow down credential stuffing at the edge, before it costs a worker. The app's
# own throttles still apply; this is the cheaper first line.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

server {
    listen 80;
    server_name _;
    # ACME lives on 80; everything else is told to come back over TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Set once, used by every location below. A name inside a variable is what
    # forces nginx through the resolver on each request rather than caching the
    # address for the life of the process. $request_uri is appended because
    # `proxy_pass $var` — unlike `proxy_pass http://name` — does not pass the
    # request path on its own; without it every request would arrive at the
    # upstream as `/`. No location here rewrites the path, so the original URI
    # is exactly the right thing to forward.
    set $backend  "http://web:8000";
    set $frontend "http://frontend:3000";

    ssl_certificate     /etc/letsencrypt/live/satfergana/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satfergana/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Must stay ABOVE the app's own ceiling (files.services.FILE_MAX_BYTES, 25M)
    # plus multipart overhead. Below it and nginx wins the argument with a bare
    # 413 that never reaches Django — so a 22M upload the app would have accepted
    # is refused with no error envelope and nothing the student can act on. The
    # app is the one that should say no, because only it can say why.
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json;

    server_tokens off;
    include /etc/nginx/security_headers.conf;

    # ─────────────────────────────────────
    # Probes — never logged, never rate-limited
    # ─────────────────────────────────────
    # proxy_params is not optional here, however dependency-free these look.
    # Without `proxy_set_header Host $host` nginx sends the UPSTREAM name —
    # `Host: backend` — which is not in ALLOWED_HOSTS, so Django answers 400 and
    # a load balancer watching /readyz takes the instance out of the pool and
    # never puts it back. The probes were the one pair of locations that skipped
    # the include, and they are the pair where a 400 is read as "this server is
    # broken" rather than shown to anyone.
    location = /healthz {
        proxy_pass $backend$request_uri;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }
    location = /readyz {
        proxy_pass $backend$request_uri;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }

    # ─────────────────────────────────────
    # Django
    # ─────────────────────────────────────
    location /static/ {
        proxy_pass $backend$request_uri;
        # Same reason as the probes: without the Host header Django sees
        # `Host: backend`, answers 400, and every stylesheet the admin and the
        # browsable API ask for fails. WhiteNoise was added precisely so those
        # would be styled; one missing include undid it.
        include /etc/nginx/proxy_params.conf;
        # Hashed filenames (WhiteNoise's manifest storage), so a year is safe.
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-stated because add_header does not inherit into a location that
        # sets one of its own — see security_headers.conf.
        include /etc/nginx/security_headers.conf;
    }

    location ~ ^/api/v1/auth/(login|register|password)/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass $backend$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass $backend$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    # NOT /admin/ — that belongs to the Next app, whose entire (admin) control
    # center lives under it. Sending /admin/ here handed /admin/users and every
    # other page to Django, which 404s them; the sidebar link to the admin panel
    # led straight out of the application.
    location /django-admin/ {
        proxy_pass $backend$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    # ─────────────────────────────────────
    # Next.js
    # ─────────────────────────────────────
    # Next does not validate Host, so this one worked without the include — which
    # is exactly why the rule is "every proxy_pass includes proxy_params", not
    # "include it where something breaks without it". The two that broke were
    # found by hand.
    location /_next/static/ {
        proxy_pass $frontend$request_uri;
        include /etc/nginx/proxy_params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security_headers.conf;
    }

    location / {
        proxy_pass $frontend$request_uri;
        include /etc/nginx/proxy_params.conf;
    }
}
