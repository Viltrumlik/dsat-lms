# DSAT LMS v2 — Nginx (TLS termination + reverse proxy)
# Domain: Deploy
#
# One host, two upstreams: /api, /admin, /static and /healthz go to Django;
# everything else is the Next.js app. Compression lives here rather than in
# Django or Next — the proxy is the one place that sees every response, and
# doing it once beats doing it twice.

upstream backend  { server web:8000;      keepalive 32; }
upstream frontend { server frontend:3000; keepalive 32; }

# Slow down credential stuffing at the edge, before it costs a worker. The app's
# own throttles still apply; this is the cheaper first line.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

server {
    listen 80;
    server_name _;
    # ACME lives on 80; everything else is told to come back over TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/satfergana/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satfergana/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # An exam session's autosave carries highlights and notes; file uploads carry
    # worksheets. 20M is generous for both and still refuses a bad actor early.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ─────────────────────────────────────
    # Probes — never logged, never rate-limited
    # ─────────────────────────────────────
    location = /healthz {
        proxy_pass http://backend;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://backend;
        access_log off;
    }

    # ─────────────────────────────────────
    # Django
    # ─────────────────────────────────────
    location /static/ {
        proxy_pass http://backend;
        # Hashed filenames (WhiteNoise's manifest storage), so a year is safe.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/api/v1/auth/(login|register|password)/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params.conf;
    }

    # ─────────────────────────────────────
    # Next.js
    # ─────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params.conf;
    }
}
