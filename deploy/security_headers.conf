# DSAT LMS v2 — Security response headers
# Domain: Deploy
#
# `include`d rather than written once in the server block, because nginx's
# add_header does NOT merge: a location that sets any header of its own drops
# every inherited one. The two static locations set Cache-Control, so without
# this include they would serve assets with no nosniff and no CSP — the classic
# way a hardened site ends up unhardened on exactly the paths that serve
# executable content.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Clickjacking. The app is never meant to be framed — an exam surface inside
# someone else's page is a phishing screen — so this is a flat refusal rather
# than SAMEORIGIN. X-Frame-Options is the same rule for browsers predating CSP3.
add_header X-Frame-Options DENY always;

# Content-Security-Policy.
#
#   script-src  'unsafe-inline' and 'unsafe-eval' are here because they are
#               currently REQUIRED, not because they are good: Next.js inlines
#               its hydration bootstrap, and the Desmos calculator evaluates
#               expressions it builds at runtime. Removing them needs a nonce
#               from Next middleware and a hosted Desmos build; until then,
#               claiming a stricter policy in a comment would be the only thing
#               achieved. What the policy still buys is the ORIGIN allowlist:
#               injected markup cannot pull a script from anywhere else.
#   img-src     https: — question figures are referenced by URL and may live on
#               any host (see the open image-upload decision). data:/blob: cover
#               KaTeX and the authenticated file downloads.
#   connect-src the API is same-origin; Desmos fetches its own assets.
#   frame-ancestors  the CSP3 spelling of the X-Frame-Options line above.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.desmos.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://www.desmos.com; frame-src https://www.desmos.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
